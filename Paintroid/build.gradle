// Local build modified 2026-09-07: remove legacy emulator plugin and add native graphics tests.
plugins {
    id "com.android.library"
    id "jacoco"
    id "com.getkeepsafe.dexcount"
    id "org.jetbrains.kotlin.android"
    id "maven-publish"
}

apply from: "gradle/code_quality_tasks.gradle"

jacoco {
    toolVersion = "0.8.10"
}

if (!project.hasProperty("signingKeystore")) {
    ext.signingKeystore = "dummyKeystore"
}

android {
    namespace = 'org.catrobat.paintroid'
    ndkVersion "27.2.12479018"
    externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" } }

    // New AGP DSL (API 35-ready)
    compileSdk = rootProject.ext.androidCompileSdkVersion

    defaultConfig {
        minSdk    = rootProject.ext.androidMinSdkVersion
        targetSdk = rootProject.ext.androidTargetSdkVersion
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters.addAll((project.findProperty('nativeAbis') ?: 'arm64-v8a,armeabi-v7a,x86_64,x86').split(',')) }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs = ["-Xstring-concat=inline"]
    }

    signingConfigs {
        signedRelease {
            storeFile = file(project.property("signingKeystore"))
            storePassword = ""
            keyAlias = ""
            keyPassword = ""
        }
    }

    if (project.hasProperty("signingKeystore") &&
            project.hasProperty("signingKeystorePassword") &&
            project.hasProperty("signingKeyAlias") &&
            project.hasProperty("signingKeyPassword")) {

        signingConfigs.signedRelease.storePassword = project.property("signingKeystorePassword")
        signingConfigs.signedRelease.keyAlias = project.property("signingKeyAlias")
        signingConfigs.signedRelease.keyPassword = project.property("signingKeyPassword")
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        signedRelease {
            initWith(release)
            signingConfig = signingConfigs.signedRelease
        }
        debug { }
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        animationsDisabled = true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1', "**/attach_hotspot_windows.dll"]
            merges += ['META-INF/licenses/ASM']
        }
    }

    lint {
        lintConfig = file('config/lint.xml')
        disable = ['ClickableViewAccessibility','StaticFieldLeak','GradleDependency','OldTargetApi','LintBaseline']
        textReport = true
        xmlReport  = true
        htmlReport = true
        xmlOutput  = file('build/reports/lint-report.xml')
        htmlOutput = file('build/reports/lint-report.html')
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'com.google.android.material:material:1.2.1'

    implementation 'androidx.core:core-ktx:1.3.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.8'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.8'
    implementation 'androidx.exifinterface:exifinterface:1.3.2'

    debugImplementation 'androidx.multidex:multidex:2.0.0'


    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.mockito:mockito-core:3.6.28'
    testImplementation 'com.nhaarman.mockitokotlin2:mockito-kotlin:2.2.0'

    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.4.3'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test:rules:1.1.1'
    androidTestImplementation 'org.mockito:mockito-android:5.15.2'
    androidTestImplementation 'com.nhaarman.mockitokotlin2:mockito-kotlin:2.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.1.0'
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.2.0"
    testImplementation "androidx.test:core-ktx:1.4.0"

}

tasks.withType(Javadoc).configureEach { enabled = false }

// Host-side Android graphics tests supplement the upstream unit tests.
tasks.withType(Test).configureEach {
    maxHeapSize = '2g'
    maxParallelForks = 1
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
}

// Local addition, 2026-09-07: this exact build carries its corresponding source.
def bundleCorrespondingSource = tasks.register('bundleCorrespondingSource', Zip) {
    archiveFileName = 'AN-Paint-source.zip'
    destinationDirectory = layout.buildDirectory.dir('generated/correspondingSource/local-source')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(rootProject.projectDir) {
        into 'AN-Paint'
        exclude '**/build/**', '**/.gradle/**', '**/.git/**', '**/.idea/**'
        exclude '**/local.properties', '**/*.keystore', '**/*.jks', '**/*.apk', '**/__pycache__/**'
    }
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/correspondingSource'))
tasks.named('preBuild').configure { dependsOn(bundleCorrespondingSource) }

// Keep native source retrieval reproducible and ahead of CMake configuration.
def fetchJxlSources = tasks.register('fetchJxlSources', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/fetch_jxl_sources.py'
}
tasks.configureEach {
    if (name.startsWith('configureCMake') || name.startsWith('buildCMake')) dependsOn(fetchJxlSources)
}
