// Local build modified 2026-09-07: use a distinct application ID and display name.
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

ext {
    appId = 'io.github.c933103.anpaint'
    appName = 'AN Paint'
}

if (project.hasProperty('independent')) {
    def today = new Date()
    appId += ".independent_${today.format('YYYYMMdd_HHmm')}"
    appName = property('independent') ?: "Paint ${today.format('MMdd HH:mm')}"
}

if (!project.hasProperty("signingKeystore")) {
    ext.signingKeystore = "dummyKeystore"
}

android {
    ndkVersion "27.2.12479018"
    compileSdkVersion rootProject.ext.androidCompileSdkVersion

    defaultConfig {
        applicationId = appId
        minSdkVersion rootProject.ext.androidMinSdkVersion
        //noinspection OldTargetApi
        targetSdkVersion rootProject.ext.androidTargetSdkVersion
        versionCode = rootProject.ext.androidVersionCode
        versionName = rootProject.ext.androidVersionName
        manifestPlaceholders += [appName: appName]
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = "17" }

    signingConfigs {
        // Local build 2026-09-07: reuse the derivative's saved key without
        // overwriting another project's default Android debug key.
        debug {
            if (project.hasProperty('localDebugKeystore')) {
                storeFile = file(project.property('localDebugKeystore'))
            }
        }
        signedRelease {
            storeFile = file(project.property("signingKeystore"))
            storePassword = ""
            keyAlias = ""
            keyPassword = ""
        }
    }

    if (project.hasProperty("signingKeystore") &&
            project.hasProperty("signingKeystorePassword") &&
            project.hasProperty("signingKeyAlias") &&
            project.hasProperty("signingKeyPassword")) {

        signingConfigs.signedRelease.storePassword = project.property("signingKeystorePassword")
        signingConfigs.signedRelease.keyAlias = project.property("signingKeyAlias")
        signingConfigs.signedRelease.keyPassword = project.property("signingKeyPassword")
    }

    buildTypes {
        debug {
            //minifyEnabled true
            //proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
        release {
            minifyEnabled true

            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
        signedRelease {
            initWith(release)
            signingConfig = signingConfigs.signedRelease
        }

    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    namespace = "io.github.c933103.anpaint"
}

tasks.withType(Detekt).configureEach {
    jvmTarget = "1.8"
    exclude("**/resources/**")
    exclude("**/build/**")
}

dependencies {
    implementation project(':Paintroid')
    androidTestImplementation 'androidx.core:core:1.3.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
}

// Local addition, 2026-09-07: record exactly the dependencies shipped in debug.
tasks.register('writeDependencyInventory') {
    doLast {
        // Download published artifacts as well as their POMs so the notice
        // generator can retain embedded LICENSE/NOTICE files before packaging.
        configurations.debugRuntimeClasspath.incoming.artifactView {
            componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
        }.files.files
        def rows = configurations.debugRuntimeClasspath.incoming.resolutionResult.allComponents.findAll {
            it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
        }.collect {
            [group: it.id.group, name: it.id.module, version: it.id.version]
        }.sort { "${it.group}:${it.name}" }
        def destination = layout.buildDirectory.file('runtime-dependencies.json').get().asFile
        destination.parentFile.mkdirs()
        destination.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(rows))
    }
}
