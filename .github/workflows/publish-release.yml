name: Publish verified GitHub release
on:
  push:
    branches: [develop]
    paths: ['verification/releases/request.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-anpaint-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify completed release tests, restore public signature and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_github_release.py verification/releases/request.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          archive: true
          name: release-publication-evidence
          retention-days: 14
          path: build/github-release/*.json
