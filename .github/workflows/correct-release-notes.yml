name: Correct verified 0.0.39 release notes
on:
  push:
    branches: [develop]
    paths: ['verification/releases/0.0.39-notes-correction.json']
  workflow_dispatch:
permissions:
  contents: read
# Serialize with the existing publisher, without changing its verification gates.
concurrency:
  group: publish-anpaint-release
  cancel-in-progress: false
jobs:
  correct-notes:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test guarded body-only correction
        run: python3 -m unittest discover -s tools -p 'test_correct_release_notes.py' -v
      - name: Correct existing release body and verify unchanged tag and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/correct_release_notes.py verification/releases/0.0.39-notes-correction.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          archive: true
          name: release-notes-correction-evidence
          retention-days: 14
          path: build/release-notes-correction/*.json
