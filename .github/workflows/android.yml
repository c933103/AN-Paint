name: Android verification
on:
  push:
    branches: [editor-unification, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Java 17 and Android 35
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Inspect original font identities
        run: |
          python3 -m pip install fonttools==4.59.2
          python3 tools/inspect_legacy_fonts.py
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --console=plain :app:writeDependencyInventory
          python3 tools/generate_native_runtime_notices.py --ndk "$ANDROID_HOME/ndk/27.2.12479018"
          python3 tools/generate_legal_notices.py
          ./gradlew --no-daemon --max-workers=2 --console=plain --continue -PnativeAbis=x86_64 :Paintroid:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:writeDependencyInventory
      - name: Run codec and installed-app tests on Android
        if: ${{ !cancelled() }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-30;google_apis;x86_64" "emulator"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name codec --package "system-images;android-30;google_apis;x86_64"
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd codec -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 -cores 2 > emulator.log 2>&1 &
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for attempt in $(seq 1 90); do
            test "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = "1" && break
            sleep 2
          done
          ./gradlew --no-daemon --max-workers=2 --console=plain --continue -PnativeAbis=x86_64 :Paintroid:connectedDebugAndroidTest :app:connectedDebugAndroidTest
      - name: Build universal APK after Android checks
        if: ${{ success() }}
        run: |
          # App instrumentation uses a smaller x86_64 APK. Assemble the final
          # distribution afterward so that all four CPU architectures remain.
          "$ANDROID_HOME/platform-tools/adb" emu kill
          ./gradlew --no-daemon --max-workers=2 --console=plain :app:assembleDebug :app:lintDebug :app:writeDependencyInventory
      - name: Prepare verification tools
        if: always()
        run: |
          mkdir -p verification-tools/lib64
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" verification-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" verification-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" verification-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" verification-tools/lib64/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-verification
          retention-days: 14
          path: |
            build/reports/legacy-font-metadata.json
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/runtime-dependencies.json
            Paintroid/src/main/assets/legal/THIRD_PARTY_NOTICES.txt
            Paintroid/src/main/assets/legal/NATIVE_RUNTIME_NOTICES.txt
            build/reports/native-runtime-notices.json
            Paintroid/build/test-results/
            Paintroid/build/outputs/androidTest-results/
            emulator.log
            Paintroid/build/reports/
            verification-tools/
