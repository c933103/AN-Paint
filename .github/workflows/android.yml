name: Android verification
on:
  push:
    branches: [editor-unification, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Java 17 and Android 35
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --console=plain :app:assembleDebug :Paintroid:testDebugUnitTest :app:lintDebug :app:writeDependencyInventory
      - name: Prepare verification tools
        if: always()
        run: |
          mkdir -p verification-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" verification-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" verification-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" verification-tools/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-verification
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/runtime-dependencies.json
            Paintroid/build/test-results/
            Paintroid/build/reports/
            verification-tools/
